<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Главная{% endblock %} · Записи</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #222; }
        header { background: #2f9e44; color: #fff; padding: 14px 24px; display: flex;
                 justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; margin-left: 16px; }
        header .logo { font-size: 20px; font-weight: bold; margin-left: 0; }
        nav { display: flex; align-items: center; }
        nav span { margin-left: 16px; }
        nav form { margin: 0 0 0 16px; }
        nav button { background: #fff; color: #2f9e44; border: none; padding: 6px 12px;
                     border-radius: 6px; cursor: pointer; font-size: 14px; }
        main { max-width: 700px; margin: 24px auto; background: #fff; padding: 24px;
               border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .note { border-bottom: 1px solid #eee; padding: 12px 0; }
        .note h3 { margin: 0 0 4px; }
        .muted { color: #777; font-size: 14px; }
        .btn { display: inline-block; background: #2f9e44; color: #fff; padding: 8px 16px;
               border-radius: 6px; text-decoration: none; border: none; cursor: pointer; font-size: 15px; }
        form p { margin: 12px 0; }
        form label { display: block; font-weight: bold; margin-bottom: 4px; }
        main form input, main form textarea { width: 100%; padding: 8px; box-sizing: border-box;
               border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .helptext, .helptext ul { color: #777; font-size: 13px; }
        .errorlist { color: #c92a2a; margin: 4px 0; padding-left: 18px; }
        table td { padding: 6px 12px 6px 0; }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}">Записи</a>
        <nav>
            <a href="{% url 'home' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Профиль</a>
                <span>Привет, {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'signup' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
